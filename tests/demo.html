<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genre Sorter demo (simulated Spotify)</title>
  <link rel="stylesheet" href="../docs/style.css">
  <style>
    .demo-banner { background: #fff1c2; color: #3d2f00; text-align: center; padding: 8px 16px; font-size: .875rem; }
    .demo-banner a { color: inherit; }
  </style>
</head>
<body>
<script type="module">
  // Runs the real web app against an in-memory Spotify, so the whole flow can be
  // tried without an account. Serve the repo root and open /tests/demo.html.
  // The app keeps the demo's saved data separate from the real site's.
  import { FakeSpotify, demoLibrary } from "./fake-spotify.mjs";

  const fake = new FakeSpotify(demoLibrary());
  window.__fake = fake;
  window.__GS_DEMO__ = {
    sharedClientId: "demo-shared-app",
    fetch: (url, opts) =>
      String(url).startsWith("https://api.spotify.com/") ? fake.fetch(url, opts) : fetch(url, opts),
  };
  // Each page load is a fresh simulated account, so start logged out every time.
  Object.keys(localStorage).filter((k) => k.startsWith("gs-demo.")).forEach((k) => localStorage.removeItem(k));

  const html = await (await fetch("../docs/index.html", { cache: "no-store" })).text();
  const page = new DOMParser().parseFromString(html, "text/html");
  page.querySelectorAll("script").forEach((s) => s.remove());
  const banner = document.createElement("div");
  banner.className = "demo-banner";
  banner.innerHTML = 'Demo with a simulated Spotify account. Nothing here touches real Spotify. The real app is at <a href="../docs/">/docs/</a>.';
  page.body.prepend(banner);
  document.body.replaceWith(document.adoptNode(page.body));
  await import("../docs/app.js");
</script>
</body>
</html>
