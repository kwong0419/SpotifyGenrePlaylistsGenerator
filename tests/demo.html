<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genre Sorter demo (simulated Spotify)</title>
  <link rel="stylesheet" href="../docs/style.css">
  <style>
    .demo-banner { background: #fff1c2; color: #3d2f00; text-align: center; padding: 8px 16px; font-size: .875rem; }
    .demo-banner a { color: inherit; }
  </style>
</head>
<body>
<script type="module">
  // Runs the real web app against an in-memory Spotify, so the whole flow can be
  // tried without an account. Serve the repo root and open /tests/demo.html.
  // The app keeps the demo's saved data separate from the real site's.
  import { FakeSpotify, demoLibrary } from "./fake-spotify.mjs";
  import { demoGroq, FakeGroq } from "./fake-groq.mjs";

  // ?artists=N swaps in a big generated library (3 songs per artist), to see the long-run
  // screens: the estimate before starting, live time left, and the multi-day pause.
  const big = +new URLSearchParams(location.search).get("artists");
  let fake, groq;
  if (big) {
    const styles = [["chicago drill", "rap"], ["bedroom pop"], ["reggaeton"], ["modern rock"], ["contemporary country"], ["house"]];
    const liked = [];
    const known = {};
    for (let a = 0; a < big; a++) {
      const name = `Artist ${a + 1}`;
      known[name] = { tags: styles[a % styles.length] };
      for (let k = 0; k < 3; k++) {
        const i = a * 3 + k;
        liked.push({ added_at: new Date(Date.UTC(2026, 8, 30) - i * 6e4).toISOString(),
          track: { id: `t${i}`, uri: `spotify:track:t${i}`, name: `Song ${i}`, type: "track", artists: [{ id: `ar${a}`, name }] } });
      }
    }
    fake = new FakeSpotify({ liked, artists: {} });
    groq = new FakeGroq({ artists: known });
  } else {
    fake = new FakeSpotify(demoLibrary());
    groq = demoGroq();
  }
  // ?models=a,b limits the simulated key to those models, e.g. the gpt-oss models a real
  // free key has. ?unnumbered=1 makes line replies leave out their numbers.
  const params = new URLSearchParams(location.search);
  if (params.get("models")) groq.models = params.get("models").split(",");
  if (params.get("unnumbered")) groq.unnumbered = true;
  window.__fake = fake;
  window.__groq = groq;
  window.__GS_DEMO__ = {
    sharedClientId: "demo-shared-app",
    fetch: (url, opts) =>
      String(url).startsWith("https://api.spotify.com/") ? fake.fetch(url, opts) : fetch(url, opts),
    groqFetch: groq.fetch, // any key works in the demo
  };
  // Each page load is a fresh simulated account, so start logged out every time.
  Object.keys(localStorage).filter((k) => k.startsWith("gs-demo.")).forEach((k) => localStorage.removeItem(k));
  // ?usedToday=N pretends N Groq tokens were already used today, to see the multi-day screens.
  const usedToday = +new URLSearchParams(location.search).get("usedToday");
  if (usedToday) localStorage.setItem("gs-demo.groqLedger:llama-3.3-70b-versatile", JSON.stringify([{ t: Date.now() - 36e5, tokens: usedToday }]));

  const html = await (await fetch("../docs/index.html", { cache: "no-store" })).text();
  const page = new DOMParser().parseFromString(html, "text/html");
  page.querySelectorAll("script").forEach((s) => s.remove());
  const banner = document.createElement("div");
  banner.className = "demo-banner";
  banner.innerHTML = 'Demo with a simulated Spotify account and Groq. Nothing here touches the real services; any Groq key works. The real app is at <a href="../docs/">/docs/</a>.';
  if (usedToday) {
    // Demo only: a fresh Groq allowance, then run again as if it were the next day.
    const next = document.createElement("button");
    next.className = "link";
    next.textContent = "Simulate next day";
    next.style.marginLeft = "8px";
    next.onclick = () => {
      Object.keys(localStorage).filter((k) => k.startsWith("gs-demo.groqLedger")).forEach((k) => localStorage.removeItem(k));
      localStorage.removeItem("gs-demo.cooldown");
      document.getElementById("retry-btn").click();
    };
    banner.append(next);
  }
  page.body.prepend(banner);
  document.body.replaceWith(document.adoptNode(page.body));
  await import("../docs/app.js");
</script>
</body>
</html>
